services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meshvault
      POSTGRES_PASSWORD: meshvault
      POSTGRES_DB: meshvault
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meshvault"]
      interval: 3s
      timeout: 5s
      retries: 20

  supervisor:
    build:
      context: ../sandboxes/supervisor
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      MESHVAULT_COMPUTER_IMAGE: meshvault/computer:local
      SANDBOX_SCREEN_NETWORK: internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../data:/data
    depends_on:
      computer:
        condition: service_completed_successfully

  computer:
    image: meshvault/computer:local
    build:
      context: ../sandboxes/computer
    command: ["true"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["bash", "-lc", "pnpm --filter @meshvault/db generate && pnpm --filter @meshvault/db exec prisma migrate deploy && pnpm --filter @meshvault/api start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshvault:meshvault@postgres:5432/meshvault
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    ports:
      - "3100:3100"
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@meshvault/worker", "start"]
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://meshvault:meshvault@postgres:5432/meshvault
      DATA_DIR: /data
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      SANDBOX_PROVIDER: docker
      AGENT_RUNTIME: pi
    volumes:
      - ../../data:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile
    command: ["pnpm", "--filter", "@meshvault/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      API_PROXY_TARGET: http://api:3100
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
