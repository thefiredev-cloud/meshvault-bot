[package]
name = "meshbot-viewer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[dependencies]
aws-lc-rs = "=1.18.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "=0.23.42", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
subtle = "=2.6.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["time"] }
url = "=2.5.8"
x509-parser = { version = "=0.18.1", features = ["verify-aws"] }
zeroize = "=1.9.0"

[dev-dependencies]
axum = "=0.8.4"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
rcgen = { version = "=0.14.8", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

